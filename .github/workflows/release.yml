name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test
        run: make test
      - name: build
        run: make build VERSION=${{ github.ref_name }}
      - name: publish GitHub release
        # a release cut by hand (gh release create) pushes the tag itself and
        # this workflow races it, so tolerate an existing release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
